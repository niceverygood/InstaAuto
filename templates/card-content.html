<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  #card {
    width: 1080px;
    height: 1350px;
    background: {{BG}};
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, 'Noto Sans KR', sans-serif;
    overflow: hidden;
    padding: 0 90px;
  }
  .page {
    position: absolute;
    top: 60px;
    right: 70px;
    color: {{TEXT}};
    opacity: 0.5;
    font-size: 34px;
    font-weight: 600;
  }
  .heading {
    color: {{ACCENT}};
    font-size: 72px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -1.5px;
    word-break: keep-all;
    margin-bottom: 56px;
  }
  .body {
    color: {{TEXT}};
    font-size: 48px;
    font-weight: 500;
    line-height: 1.65;
    letter-spacing: -0.5px;
    word-break: keep-all;
    white-space: pre-line;
  }
  .footer {
    position: absolute;
    bottom: 54px;
    left: 0;
    right: 0;
    text-align: center;
    color: {{TEXT}};
    opacity: 0.65;
    font-size: 32px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="page">{{PAGE}}</div>
    <div class="heading">{{HEADING}}</div>
    <div class="body">{{BODY}}</div>
    <div class="footer">{{FOOTER}}</div>
  </div>
</body>
</html>
