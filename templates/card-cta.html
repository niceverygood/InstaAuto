<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  #card {
    width: 1080px;
    height: 1350px;
    background: {{BG}};
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, 'Noto Sans KR', sans-serif;
    overflow: hidden;
    padding: 0 80px;
  }
  .title {
    color: {{TEXT}};
    font-size: 96px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -2px;
    word-break: keep-all;
    margin-bottom: 52px;
  }
  .title .accent { color: {{ACCENT}}; }
  .sub {
    color: {{TEXT}};
    opacity: 0.9;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.6;
    word-break: keep-all;
    margin-bottom: 90px;
  }
  .cta-btn {
    display: inline-block;
    background: {{ACCENT}};
    color: {{BG_SOLID}};
    font-size: 46px;
    font-weight: 800;
    padding: 34px 64px;
    border-radius: 60px;
    letter-spacing: -0.5px;
  }
  .footer {
    position: absolute;
    bottom: 54px;
    left: 0;
    right: 0;
    text-align: center;
    color: {{TEXT}};
    opacity: 0.65;
    font-size: 32px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="title">{{TITLE_HTML}}</div>
    <div class="sub">{{SUB}}</div>
    <div class="cta-btn">{{CTA_BUTTON}}</div>
    <div class="footer">{{FOOTER}}</div>
  </div>
</body>
</html>
